<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개발 작업실 완성</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, 'Malgun Gothic', sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f1f5f9; color:#0f172a; }
    main { max-width:640px; margin:20px; padding:44px; background:#fff; border-radius:20px; box-shadow:0 15px 35px #0f172a16; }
    .label {font-size:13px; font-weight:700; letter-spacing:0.12em; color:#2563eb; }
    h1 {font-size:clamp(28px,5vw,42px);margin:12px 0;}
    p {line-height:1.7;color:#475569;} code {background:#e2e8f0;padding:2px 6px;border-radius:4px;}
  </style>
</head>
<body><main><div class="label">DOCKER WORKSTATION LAB</div>
<h1>개발 작업실 구축 성공 🚀</h1>
<p>이 페이지는 직접 만든 <strong>Dockerfile</strong>과 NGINX 컨테이너로 실행 중입니다.</p>
<p>확인할 것: <code>localhost:8080</code> 및 <code>localhost:8081</code> 포트 접속</p>
<p id="message">바인드 마운트 테스트: 수정 성공!</p>
</main></body></html>
